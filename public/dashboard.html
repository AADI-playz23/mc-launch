<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbsoraCloud | User Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #020205; --bg-panel: #0a0a12;
            --text-main: #f1f5f9; --text-muted: #94a3b8;
            --accent: #8b5cf6; --accent-glow: #06b6d4;
            --success: #10b981; --danger: #ef4444;
            --border: #1e1e2e;
        }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-main); color: var(--text-main); background-image: radial-gradient(circle at top right, #1e1b4b 0%, transparent 40%); min-height: 100vh; }
        nav { background: rgba(2, 2, 5, 0.8); backdrop-filter: blur(12px); padding: 1rem 3rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand { background: linear-gradient(to right, var(--accent), var(--accent-glow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; font-weight: 800; }
        .container { max-width: 1200px; margin: 3rem auto; padding: 0 2rem; }
        .header-flex { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 3rem; flex-wrap: wrap; }
        .dash-title { font-size: 2.2rem; margin: 0; font-weight: 800; }
        .plan-badge { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.5rem 1.5rem; border-radius: 12px; background: rgba(6, 182, 212, 0.1); color: var(--accent-glow); border: 2px solid rgba(6, 182, 212, 0.4); box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 2rem; }
        .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5); }
        .label { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; display: block; }
        input, select { width: 100%; padding: 0.9rem 1rem; background: #020205; border: 1px solid var(--border); border-radius: 12px; color: white; font-family: inherit; font-size: 0.95rem; margin-bottom: 1.2rem; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        .btn { padding: 0.9rem 1.5rem; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; transition: 0.2s; width: 100%; font-family: inherit; font-size: 1rem; }
        .btn-p { background: linear-gradient(135deg, var(--accent), #6d28d9); color: white; }
        .btn-p:hover { filter: brightness(1.2); transform: scale(1.02); }
        .btn-d { background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-top: 1rem; }
        .btn-d:hover { background: rgba(239, 68, 68, 0.1); }
    </style>
</head>

<body>
    <nav>
        <div class="brand">AbsoraCloud</div>
        <div style="display:flex; align-items:center; gap:1.5rem;">
            <span id="nav-user" style="color:var(--text-muted); font-weight:600;"></span>
            <button onclick="logout()" style="background:transparent; border:1px solid var(--border); color:white; padding:0.5rem 1rem; border-radius:8px; cursor:pointer;">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="header-flex">
            <h2 class="dash-title">User Dashboard</h2>
            <div id="plan-badge" class="plan-badge">Loading...</div>
        </div>
        <div id="instances-grid" class="grid"></div>
    </div>

    <script>
        const user = localStorage.getItem('absora_user') || 'Pilot';
        let plan = (localStorage.getItem('absora_plan') || 'free').toLowerCase();
        let instances = [];
        let defaultVersions = '<option value="latest">Latest</option>';

        const PLANS = {
            'free': { label: 'Free Trial', slots: 1, ram: '4G', badge: '#64748b' },
            'starter': { label: 'Starter Orbit', slots: 1, ram: '4G', badge: '#06b6d4' },
            'advanced': { label: 'Advanced Core', slots: 2, ram: '6G', badge: '#8b5cf6' },
            'nexus': { label: 'Extreme Nexus', slots: 3, ram: '8G', badge: '#f59e0b' },
            'quantum': { label: 'Quantum Server', slots: 4, ram: '16G', badge: '#10b981' },
        };
        let currentPlan = PLANS[plan] || PLANS['free'];

        function logout() {
            localStorage.clear();
            document.cookie = "auth_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            location.href = 'index.html';
        }

        window.onload = async () => {
            document.getElementById('nav-user').innerText = user;
            document.getElementById('plan-badge').innerText = currentPlan.label;
            document.getElementById('plan-badge').style.color = currentPlan.badge;
            document.getElementById('plan-badge').style.borderColor = currentPlan.badge + '66';
            document.getElementById('plan-badge').style.background = currentPlan.badge + '18';

            try {
                const syncRes = await fetch('/api/instances');
                const syncData = await syncRes.json();
                if (syncData.status === 'success') {
                    instances = syncData.instances || [];
                }
            } catch (e) {
                console.error("Failed to load instances", e);
            }
            render();
        };

        function onGameChange(id) {
            // Deprecated: Now strictly Minecraft only
        }

        function render() {
            const grid = document.getElementById('instances-grid');
            grid.innerHTML = '';
            
            // Render existing servers
            instances.forEach((data, index) => {
                const i = index + 1;
                // Connection endpoint uses the astrocore.qzz.io domain
                var liveIp = `${data.servername}.astrocore.qzz.io`;
                var isOnline = localStorage.getItem('absora_online_' + data.instance_id) === '1';
                grid.innerHTML += `
                    <div class="card">
                        <span class="label" style="color:${isOnline ? 'var(--success)' : 'var(--text-muted)'}">
                            ${isOnline ? '● ONLINE' : '○ OFFLINE'} · ${data.game.toUpperCase()}
                        </span>
                        <h3 style="margin:0 0 0.5rem 0; font-size:1.8rem;">${data.servername}</h3>
                        <code style="color:var(--accent-glow); display:block; margin-bottom:0.5rem; font-size:1rem; background:rgba(6,182,212,0.1); padding:0.5rem; border-radius:6px; cursor:pointer;" onclick="navigator.clipboard.writeText('${liveIp}')" title="Click to copy">${liveIp} 📋</code>
                        <p style="font-size:0.75rem; color:var(--text-muted); margin:0 0 1.5rem 0;">Software: ${data.software} | RAM: ${data.ram}</p>
                        <button class="btn btn-p" onclick="location.href='console.html?id=${data.instance_id}'">Open Console</button>
                        <button class="btn btn-d" onclick="deleteServer('${data.instance_id}')">Wipe Data</button>
                    </div>`;
            });

            // Render empty slots up to plan limit
            for (let i = instances.length + 1; i <= currentPlan.slots; i++) {
                grid.innerHTML += `
                    <div class="card" style="border-style: dashed; background: rgba(255,255,255,0.01);">
                        <span class="label">CREATE NEW NODE</span>
                        
                        <label class="label">Node Subdomain</label>
                        <input type="text" id="n-${i}" placeholder="e.g. survival">
                        
                        <input type="hidden" id="g-${i}" value="minecraft">

                        <label class="label">Software / Distribution</label>
                        <select id="s-${i}" onchange="loadVersions(${i})">
                            <option value="paper">PaperMC</option>
                            <option value="fabric">Fabric</option>
                            <option value="forge">Forge</option>
                            <option value="high_performance">High Performance</option>
                            <option value="hybrid">Hybrid</option>
                            <option value="proxies">Proxies</option>
                            <option value="purpur">Purpur</option>
                            <option value="quilt">Quilt</option>
                            <option value="spigot">Spigot</option>
                        </select>

                        <label class="label">Version</label>
                        <select id="v-${i}">
                            <option value="latest">Loading...</option>
                        </select>

                        <button class="btn btn-p" onclick="setup(${i})" style="margin-top:0.5rem;">Provision Node</button>
                    </div>`;
            }
            
            // Populate versions after rendering
            for (let i = instances.length + 1; i <= currentPlan.slots; i++) {
                loadVersions(i);
            }
        }

        async function loadVersions(id) {
            const select = document.getElementById(`s-${id}`);
            const versionSelect = document.getElementById(`v-${id}`);
            const software = select.value;
            
            versionSelect.innerHTML = '<option value="latest">Loading...</option>';
            versionSelect.disabled = true;
            
            try {
                const res = await fetch(`/api/software?type=${software}`);
                if (!res.ok) throw new Error("API error");
                const data = await res.json();
                
                if (data.status !== "success") throw new Error(data.message);
                
                versionSelect.innerHTML = '';
                
                if (data.latest) {
                    versionSelect.innerHTML += `<option value="latest">Latest (${data.latest})</option>`;
                }
                
                if (data.versions && data.versions.length > 0) {
                    for (const ver of data.versions) {
                        versionSelect.innerHTML += `<option value="${ver}">${ver}</option>`;
                    }
                }
            } catch(e) {
                console.error("Failed to load versions:", e);
                versionSelect.innerHTML = '<option value="latest">Latest</option>';
            } finally {
                versionSelect.disabled = false;
            }
        }

        async function setup(id) {
            const name = document.getElementById(`n-${id}`).value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            if (!name) return alert("Please enter a valid node name.");

            const btn = document.querySelector(`[onclick="setup(${id})"]`);
            btn.innerText = 'Provisioning...';
            btn.disabled = true;

            const payload = {
                servername: name,
                game: document.getElementById(`g-${id}`).value,
                software: document.getElementById(`s-${id}`).value,
                version: document.getElementById(`v-${id}`).value
            };

            try {
                const res = await fetch('/api/instances', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    // Refresh
                    window.onload();
                } else {
                    alert("Error: " + data.message);
                }
            } catch (e) {
                alert("Network error");
            } finally {
                btn.innerText = 'Provision Node';
                btn.disabled = false;
            }
        }

        async function deleteServer(instance_id) {
            if (!confirm('Are you sure you want to completely wipe this instance?')) return;
            
            try {
                const res = await fetch('/api/instances', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instance_id: parseInt(instance_id) })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    localStorage.removeItem('absora_online_' + instance_id);
                    window.onload();
                }
            } catch (e) {
                alert("Failed to delete.");
            }
        }
    </script>
</body>

</html>
