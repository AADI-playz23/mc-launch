<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbsoraCloud | Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg-main: #020205;
            --bg-panel: #0a0a12;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-glow: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #1e1e2e;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
        }

        nav {
            background: rgba(2, 2, 5, 0.8);
            backdrop-filter: blur(12px);
            padding: 1rem 3rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .panel {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--bg-panel);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .tab-bar {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .tab-bar::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
        }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { color: var(--accent-glow); border-bottom-color: var(--accent-glow); }

        .view { display: none; }
        .view.active { display: block; }

        #terminal-container {
            background: #000;
            padding: 1rem;
            height: 480px;
            border: 1px solid var(--border);
            border-radius: 12px 12px 0 0;
            border-bottom: none;
            overflow: hidden;
        }

        .usage-bar {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 0 0 12px 12px;
            padding: 1.2rem;
            display: flex;
            gap: 2rem;
        }
        .u-box { flex: 1; }
        .u-label { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.5rem; }
        .progress-bg { background: #1e1e2e; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.3s; }

        .btn { padding: 0.8rem 1.5rem; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; color: white; font-family: inherit; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-p { background: linear-gradient(135deg, var(--accent), #6d28d9); }
        .btn-s { background: var(--success); }
        .btn-d { background: var(--danger); }
        .btn-w { background: var(--warning); }

        input, select, textarea {
            width: 100%; padding: 0.8rem; background: #020205; border: 1px solid var(--border);
            border-radius: 8px; color: white; font-family: inherit; box-sizing: border-box;
        }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
        .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
        .status-dot.offline { background: #555; }
        .status-dot.busy { background: var(--warning); box-shadow: 0 0 6px var(--warning); animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.4 } }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .file-icon { color: var(--text-muted); margin-right: 0.5rem; }
        .dir-icon { color: var(--accent-glow); margin-right: 0.5rem; }
        
        /* Modrinth Cards */
        .mod-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; display: flex; flex-direction: column; justify-content: space-between; }
        .mod-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }
            .panel {
                margin: 1rem;
                padding: 1.2rem;
                border-radius: 12px;
            }
            .tab-bar {
                margin-bottom: 1rem;
            }
            .tab-btn {
                padding: 0.8rem 1rem;
                font-size: 0.88rem;
            }
            #ip-bar {
                padding: 0.75rem 1rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            #ip-bar button {
                width: 100%;
                margin-left: 0 !important;
            }
            /* Wrap power buttons on mobile */
            #v-console > div:first-child {
                flex-wrap: wrap;
                gap: 8px;
            }
            #v-console > div:first-child button {
                flex: 1 1 45%;
                font-size: 0.85rem;
                padding: 0.75rem;
            }
            #v-console > div:first-child button:last-child {
                flex: 1 1 100%;
                margin-left: 0 !important;
            }
            .usage-bar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            #v-props > div:first-child {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start !important;
            }
            #v-props > div:first-child button {
                width: 100%;
            }
            #prop-grid {
                grid-template-columns: 1fr !important;
                gap: 1.2rem !important;
            }
            /* Table wrap for files */
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            tr {
                border-bottom: 1px solid var(--border);
                padding: 0.5rem 0;
            }
            td {
                border: none;
                position: relative;
                padding: 0.4rem 0.8rem;
                text-align: right;
            }
            td::before {
                position: absolute;
                left: 10px;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                text-align: left;
                font-weight: bold;
                color: var(--text-muted);
            }
            td:nth-of-type(1) { text-align: left; padding-left: 10px; }
            td:nth-of-type(2)::before { content: "Size"; }
            td:nth-of-type(3)::before { content: "Actions"; }
            
            /* Backup item layout */
            .mod-card {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 12px;
            }
            .mod-card > div:last-child {
                display: flex;
                gap: 8px;
            }
            .mod-card > div:last-child button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <nav>
        <h1 style="margin:0; background: linear-gradient(to right, var(--accent), var(--accent-glow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AbsoraCloud</h1>
        <button onclick="location.href='dashboard.html'" class="btn" style="background:#1e1e2e;">Back to Dashboard</button>
    </nav>

    <div class="panel">
        <h2 style="margin-top:0; margin-bottom:0.75rem; font-size:1.8rem;">
            Console: <span id="server-title" style="color:var(--accent)">Loading...</span>
            <span style="font-size:0.85rem; color:var(--text-muted); margin-left:1rem;">
                <span class="status-dot offline" id="conn-dot"></span><span id="conn-txt">Connecting...</span>
            </span>
        </h2>
        
        <div id="ip-bar" style="display:none; background:#0a0a12; border:1px solid #1e1e2e; border-radius:10px; padding:0.75rem 1.25rem; margin-bottom:1.5rem; gap:2rem; flex-wrap:wrap; align-items:center;">
            <div>
                <div style="font-size:0.7rem; color:#94a3b8; font-weight:800; margin-bottom:2px;">CONNECT ADDRESS</div>
                <div id="ip-domain" style="font-family:'JetBrains Mono',monospace; color:#06b6d4; font-size:1.2rem; font-weight:700;">Waiting for server...</div>
                <div id="ip-bore" style="font-size:0.8rem; color:var(--text-muted);"></div>
            </div>
            <button onclick="copyIP()" style="margin-left:auto; background:#1e1e2e; border:1px solid #334155; color:white; padding:0.6rem 1.2rem; border-radius:6px; cursor:pointer; font-weight:700;"><i class="fa-solid fa-copy"></i> Copy IP</button>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="tab('console', this)">📊 Console</button>
            <button class="tab-btn" onclick="tab('players', this)">👥 Players</button>
            <button class="tab-btn" onclick="tab('props', this)">⚙️ Properties</button>
            <button class="tab-btn" onclick="tab('plugins', this)">🔌 Plugins</button>
            <button class="tab-btn" onclick="tab('mods', this)">🧩 Mods</button>
            <button class="tab-btn" onclick="tab('files', this)">📁 Files</button>
            <button class="tab-btn" onclick="tab('backups', this); loadBackups();">☁️ Backups</button>
        </div>

        <div id="v-console" class="view active">
            <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
                <button class="btn btn-s" id="btn-start" onclick="power('start')"><i class="fa-solid fa-play"></i> Start</button>
                <button class="btn btn-w" id="btn-restart" onclick="power('restart')"><i class="fa-solid fa-rotate-right"></i> Restart</button>
                <button class="btn btn-d" id="btn-stop" onclick="power('stop')"><i class="fa-solid fa-stop"></i> Stop</button>
                <button class="btn btn-d" style="background:#991b1b" onclick="power('kill')"><i class="fa-solid fa-skull"></i> Kill</button>
                <button class="btn btn-p" style="margin-left:auto;" onclick="renewTime()">Renew Time (12h)</button>
            </div>
            
            <div id="terminal-container"></div>
            
            <div class="usage-bar">
                <div class="u-box">
                    <div class="u-label"><span>CPU USAGE</span><span id="c-txt">0%</span></div>
                    <div class="progress-bg"><div id="c-bar" class="progress-fill" style="width:0%; background:var(--accent-glow)"></div></div>
                </div>
                <div class="u-box">
                    <div class="u-label"><span>RAM USAGE</span><span id="r-txt">0 MB / ? MB</span></div>
                    <div class="progress-bg"><div id="r-bar" class="progress-fill" style="width:0%; background:var(--accent)"></div></div>
                </div>
            </div>
            
            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                <input type="text" id="cmd-input" placeholder="Type a command (/say Hello)..." onkeypress="if(event.key==='Enter') sendCmd()">
                <button class="btn btn-p" onclick="sendCmd()">Execute</button>
            </div>
        </div>

        <div id="v-players" class="view">
            <div style="display:flex; gap:1rem; margin-bottom:1rem;">
                <input type="text" id="p-user" placeholder="Player Username">
                <button class="btn btn-s" onclick="wsCmd('op ' + document.getElementById('p-user').value)">OP</button>
                <button class="btn btn-d" onclick="wsCmd('deop ' + document.getElementById('p-user').value)">De-OP</button>
            </div>
            <div style="display:flex; gap:1rem; margin-bottom:1rem;">
                <input type="text" id="k-user" placeholder="Player Username">
                <button class="btn btn-w" onclick="wsCmd('kick ' + document.getElementById('k-user').value)">Kick</button>
                <button class="btn btn-d" onclick="wsCmd('ban ' + document.getElementById('k-user').value)">Ban</button>
            </div>
        </div>

        <div id="v-props" class="view">
            <div style="display:flex; justify-content:space-between; margin-bottom:1.5rem;">
                <h3 style="margin:0;">Server.properties Editor</h3>
                <button class="btn btn-s" onclick="saveProps()">Apply Changes</button>
            </div>
            <div id="prop-load" style="padding:2rem; text-align:center; color:var(--warning);">Loading properties... (Server must be booted at least once)</div>
            <div id="prop-grid" style="display:none; grid-template-columns: 1fr 1fr; gap: 1.5rem;"></div>
        </div>

        <div id="v-plugins" class="view">
            <div style="display:flex; gap:1rem; margin-bottom:1.5rem;">
                <input type="text" id="pl-q" placeholder="Search Modrinth Plugins..." style="flex:1;" onkeypress="if(event.key==='Enter') searchAddons('plugin')">
                <button class="btn btn-p" onclick="searchAddons('plugin')">Search</button>
            </div>
            <div id="pl-res" class="mod-grid"></div>
        </div>

        <div id="v-mods" class="view">
            <div style="display:flex; gap:1rem; margin-bottom:1.5rem;">
                <select id="md-loader" style="width:140px;">
                    <option value="">Any loader</option>
                    <option value="fabric">Fabric</option>
                    <option value="forge">Forge</option>
                    <option value="neoforge">NeoForge</option>
                    <option value="quilt">Quilt</option>
                </select>
                <input type="text" id="md-q" placeholder="Search Modrinth Mods..." style="flex:1;" onkeypress="if(event.key==='Enter') searchAddons('mod')">
                <button class="btn btn-p" onclick="searchAddons('mod')">Search</button>
            </div>
            <div id="md-res" class="mod-grid"></div>
        </div>

        <div id="v-files" class="view">
            <div>
                <p style="color:var(--accent); font-weight:bold;">Path: /<span id="f-path"></span></p>
                <div style="display:flex; gap:1rem; margin-bottom:1rem; align-items:center;">
                    <input type="file" id="f-up" style="width:auto; margin:0;" multiple>
                    <button class="btn btn-s" onclick="uploadFiles()">Upload</button>
                    <button class="btn btn-p" onclick="loadFiles(cPath)">Refresh</button>
                </div>
                <div style="background:#000; border-radius:8px; border:1px solid var(--border); max-height:400px; overflow-y:auto;">
                    <table>
                        <thead><tr><th>Name</th><th>Size</th><th style="width:100px;">Actions</th></tr></thead>
                        <tbody id="f-list"><tr><td colspan="3" style="text-align:center;">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="v-backups" class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
                <h3 style="margin:0;">Runner Backups</h3>
                <button class="btn btn-s" onclick="wsCmdJson({type:'backup_create'})">Generate Backup Now</button>
            </div>
            <div id="backup-list" style="display:flex; flex-direction:column; gap:1rem;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    
    <script>
        const instId = new URLSearchParams(window.location.search).get('id');
        let term, ws;
        let cPath = "";
        let currentSessionId = null;
        let wsToken = null;
        let propMap = {};
        let statsInterval = null;

        function tab(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('v-' + id).classList.add('active');
            btn.classList.add('active');
            if (id === 'console' && term) fitAddon.fit();
            if (id === 'files' && ws && ws.readyState === WebSocket.OPEN) loadFiles(cPath);
            if (id === 'props' && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'file_read', path: 'server.properties' }));
        }

        term = new Terminal({ theme: { background: '#000000' }, convertEol: true });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();
        window.addEventListener('resize', () => {
            if(document.getElementById('v-console').classList.contains('active')) fitAddon.fit();
        });

        let inputBuffer = '';
        term.onData(e => {
            if (e === '\r') {
                term.write('\r\n');
                wsCmd(inputBuffer);
                inputBuffer = '';
            } else if (e === '\u007F') {
                if (inputBuffer.length > 0) {
                    inputBuffer = inputBuffer.substr(0, inputBuffer.length - 1);
                    term.write('\b \b');
                }
            } else {
                inputBuffer += e;
                term.write(e);
            }
        });

        // ── API Lifecycle ──
        async function fetchServerInfo() {
            const res = await fetch(`/api/instances`);
            const data = await res.json();
            if(data.instances) {
                const inst = data.instances.find(i => i.instance_id == instId);
                if(inst) document.getElementById('server-title').innerText = inst.servername;
            }
        }

        async function bootServer() {
            term.writeln('\x1b[1;36m[AbsoraCloud]\x1b[0m Requesting resources...');
            setConnStatus('busy', 'Allocating...');
            try {
                const res = await fetch('/api/dispatch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instance_id: instId })
                });
                const data = await res.json();

                if (data.status === 'success' || data.status === 'assigned' || data.status === 'queued') {
                    currentSessionId = data.session_id;
                    pollStatus(data.session_id);
                } else {
                    term.writeln(`\x1b[1;31m[Error]\x1b[0m ${data.message}`);
                    setConnStatus('offline', 'Error');
                }
            } catch (e) {
                term.writeln('\x1b[1;31m[Error]\x1b[0m Failed to contact API.');
                setConnStatus('offline', 'API Error');
            }
        }

        async function pollStatus(sessionId) {
            const interval = setInterval(async () => {
                const res = await fetch(`/api/status?session_id=${sessionId}`);
                const data = await res.json();
                if (data.status === 'running') {
                    clearInterval(interval);
                    term.writeln('\x1b[1;32m[System]\x1b[0m Runner active. Establishing WebSocket tunnel...');
                    connectWebSocket(data.worker_url, sessionId);
                }
            }, 3000);
        }

        async function connectWebSocket(workerUrl, sessionId) {
            // Get JWT for WS Auth
            try {
                const authRes = await fetch('/api/ws_auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                const authData = await authRes.json();
                if(!authData.ws_token) throw new Error("Failed to get WS Token");
                wsToken = authData.ws_token;
                
                ws = new WebSocket(workerUrl);
                ws.onopen = () => {
                    setConnStatus('online', 'Connected');
                    ws.send(JSON.stringify({ token: wsToken }));
                    ws.send(JSON.stringify({ type: 'file_read', path: 'server.properties' }));
                    if (statsInterval) clearInterval(statsInterval);
                    statsInterval = setInterval(() => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'stats' }));
                        }
                    }, 3000);
                };
                
                ws.onmessage = handleWsMessage;
                
                ws.onclose = async () => {
                    if (statsInterval) {
                        clearInterval(statsInterval);
                        statsInterval = null;
                    }
                    setConnStatus('offline', 'Disconnected');
                    document.getElementById('ip-bar').style.display = 'none';
                    term.writeln('\n\x1b[1;31m[System]\x1b[0m Connection to runner lost. Checking status...');
                    
                    try {
                        const statRes = await fetch(`/api/status?session_id=${sessionId}`);
                        const stat = await statRes.json();
                        if (stat.status === 'stopped' || stat.status === 'crashed') {
                            term.writeln('\x1b[1;31m[System]\x1b[0m Server has stopped. Click Start to launch a new session.');
                            return; // Stop reconnecting loop
                        }
                    } catch(e) {}

                    term.writeln('\x1b[1;33m[System]\x1b[0m Reconnecting...');
                    setTimeout(() => connectWebSocket(workerUrl, sessionId), 5000);
                };
            } catch (e) {
                term.writeln(`\x1b[1;31m[Auth Error]\x1b[0m ${e.message}`);
            }
        }

        function handleWsMessage(e) {
            const msg = JSON.parse(e.data);
            if (msg.type === 'message') {
                term.write(msg.data);
            } else if (msg.type === 'server_ip') {
                document.getElementById('ip-bar').style.display = 'flex';
                document.getElementById('ip-domain').innerText = msg.domain;
                document.getElementById('ip-bore').innerText = `Internal Tunnel: bore.pub:${msg.bore_port}`;
            } else if (msg.type === 'file_list_result') {
                renderFiles(msg.path, msg.items);
            } else if (msg.type === 'file_read_result' && msg.path === 'server.properties') {
                renderProps(msg.content);
            } else if (msg.type === 'file_write_success') {
                alert("File saved successfully.");
            } else if (msg.type === 'backup_list_result') {
                renderBackups(msg.backups);
            } else if (msg.type === 'backup_success' || msg.type === 'backup_delete_success' || msg.type === 'backup_restore_success') {
                alert("Backup operation completed!");
                if(document.getElementById('v-backups').classList.contains('active')) loadBackups();
            } else if (msg.type === 'error' || msg.type === 'file_error' || msg.type === 'backup_error') {
                alert("Daemon Error: " + msg.message);
                term.writeln(`\n\x1b[1;31m[Error]\x1b[0m ${msg.message}`);
            } else if (msg.type === 'download_success') {
                alert("Modrinth download completed successfully.");
            } else if (msg.type === 'unzip_success') {
                alert("Extracted successfully.");
                loadFiles(cPath);
            } else if (msg.type === 'stats_result') {
                document.getElementById('c-txt').innerText = `${msg.cpu}%`;
                document.getElementById('c-bar').style.width = `${msg.cpu}%`;
                const ramUsed = msg.ram;
                const ramMax = msg.max_ram || 4096;
                const ramPercent = Math.min(100, Math.max(0, (ramUsed / ramMax) * 100));
                document.getElementById('r-txt').innerText = `${ramUsed} MB / ${ramMax} MB`;
                document.getElementById('r-bar').style.width = `${ramPercent}%`;
            }
        }

        // ── Console Helpers ──
        function setConnStatus(state, text) {
            const dot = document.getElementById('conn-dot');
            dot.className = `status-dot ${state}`;
            document.getElementById('conn-txt').innerText = text;
        }

        async function power(action) {
            if (action === 'start') return bootServer();
            if (action === 'kill' && (!ws || ws.readyState !== WebSocket.OPEN)) {
                if(confirm("Force reset session? (Use this if the server is stuck or crashed)")) {
                    await fetch('/api/dispatch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instance_id: instId, force_trigger: true })
                    });
                    alert("Session force-cleared. You can now click Start.");
                    document.getElementById('ip-bar').style.display = 'none';
                    setConnStatus('offline', 'Killed');
                }
                return;
            }
            wsCmdJson({ type: 'power', action });
        }
        function renewTime() {
            if(!currentSessionId) return;
            fetch('/api/renew', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: currentSessionId }) })
            .then(r=>r.json()).then(data => {
                if(data.status === 'success') alert("Session renewed for 12 hours.");
            });
        }
        function wsCmd(cmd) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                term.writeln(`\x1b[38;5;245m> ${cmd}\x1b[0m`);
                ws.send(JSON.stringify({ type: 'command', command: cmd }));
            }
        }
        function wsCmdJson(json) {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(json));
        }
        function sendCmd() {
            const input = document.getElementById('cmd-input');
            if(input.value) { wsCmd(input.value); input.value = ''; }
        }
        function copyIP() {
            const text = document.getElementById('ip-domain').innerText;
            navigator.clipboard.writeText(text);
            alert("IP Copied: " + text);
        }

        // ── Files ──
        function loadFiles(path = "") {
            cPath = path;
            document.getElementById('f-path').innerText = path;
            wsCmdJson({ type: 'file_list', path });
        }
        function renderFiles(path, items) {
            const tbody = document.getElementById('f-list');
            tbody.innerHTML = '';
            if (path !== '') {
                const parent = path.split('/').slice(0, -1).join('/');
                tbody.innerHTML += `<tr><td><a href="#" onclick="loadFiles('${parent}')" style="color:var(--text-main);text-decoration:none;"><i class="fa-solid fa-folder-open dir-icon"></i> ..</a></td><td>-</td><td></td></tr>`;
            }
            items.sort((a,b) => b.is_dir - a.is_dir).forEach(i => {
                const nPath = path ? `${path}/${i.name}` : i.name;
                const icon = i.is_dir ? '<i class="fa-solid fa-folder dir-icon"></i>' : '<i class="fa-solid fa-file file-icon"></i>';
                const name = i.is_dir ? `<a href="#" onclick="loadFiles('${nPath}')" style="color:var(--text-main);text-decoration:none;">${i.name}</a>` : i.name;
                
                let actions = `<button class="btn btn-d" style="padding:0.4rem;" onclick="if(confirm('Delete?')) wsCmdJson({type:'file_delete', path:'${nPath}'})"><i class="fa-solid fa-trash"></i></button>`;
                if(i.name.endsWith('.zip')) {
                    actions += ` <button class="btn btn-p" style="padding:0.4rem;" onclick="wsCmdJson({type:'file_unzip', path:'${nPath}'})"><i class="fa-solid fa-box-open"></i></button>`;
                }

                tbody.innerHTML += `<tr><td>${icon} ${name}</td><td>${i.is_dir ? '-' : (i.size/1024).toFixed(1)+' KB'}</td><td>${actions}</td></tr>`;
            });
        }
        async function uploadFiles() {
            const files = document.getElementById('f-up').files;
            if(!files.length || !ws) return;
            for(let f of files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const b64 = e.target.result.split(',')[1];
                    const nPath = cPath ? `${cPath}/${f.name}` : f.name;
                    wsCmdJson({ type: 'file_upload', path: nPath, content: b64 });
                };
                reader.readAsDataURL(f);
            }
            document.getElementById('f-up').value = '';
        }

        // ── Properties ──
        function renderProps(content) {
            propMap = {};
            document.getElementById('prop-load').style.display = 'none';
            const grid = document.getElementById('prop-grid');
            grid.style.display = 'grid';
            grid.innerHTML = '';
            
            content.split('\n').forEach(line => {
                if(!line || line.startsWith('#')) return;
                const [k, ...v] = line.split('=');
                const val = v.join('=');
                propMap[k] = val;
                
                const w = document.createElement('div');
                let inp = `<input type="text" id="pr-${k}" value="${val}">`;
                if(val === 'true' || val === 'false') {
                    inp = `<select id="pr-${k}"><option value="true" ${val==='true'?'selected':''}>true</option><option value="false" ${val==='false'?'selected':''}>false</option></select>`;
                }
                w.innerHTML = `<label class="u-label">${k}</label>${inp}`;
                grid.appendChild(w);
            });
        }
        function saveProps() {
            let out = "#Minecraft server properties\n";
            for(let k in propMap) {
                const el = document.getElementById(`pr-${k}`);
                out += `${k}=${el ? el.value : propMap[k]}\n`;
            }
            wsCmdJson({ type: 'file_write', path: 'server.properties', content: out });
        }

        // ── Modrinth (Mods/Plugins) ──
        async function searchAddons(type) {
            const q = document.getElementById(type === 'plugin' ? 'pl-q' : 'md-q').value;
            const res = await fetch(`https://api.modrinth.com/v2/search?query=${encodeURIComponent(q)}&facets=[["project_type:${type}"]]`);
            const data = await res.json();
            
            const cont = document.getElementById(type === 'plugin' ? 'pl-res' : 'md-res');
            cont.innerHTML = '';
            
            data.hits.forEach(h => {
                cont.innerHTML += `
                    <div class="mod-card">
                        <div>
                            <div style="display:flex; align-items:center; margin-bottom:1rem;">
                                ${h.icon_url ? `<img src="${h.icon_url}" style="width:48px;height:48px;border-radius:8px;margin-right:1rem;">` : ''}
                                <h4 style="margin:0;">${h.title}</h4>
                            </div>
                            <p style="font-size:0.85rem;color:var(--text-muted);">${h.description}</p>
                        </div>
                        <button class="btn btn-p" style="margin-top:1rem;width:100%;" onclick="installModrinth('${h.project_id}', '${type}')">Install Latest</button>
                    </div>
                `;
            });
        }
        async function installModrinth(projectId, type) {
            if(!ws) return alert("Console offline.");
            try {
                const res = await fetch(`https://api.modrinth.com/v2/project/${projectId}/version`);
                const versions = await res.json();
                if(versions.length > 0 && versions[0].files.length > 0) {
                    const f = versions[0].files[0];
                    const folder = type === 'plugin' ? 'plugins' : 'mods';
                    wsCmdJson({ type: 'download_url', url: f.url, path: `${folder}/${f.filename}` });
                    alert(`Downloading ${f.filename} to ${folder}/...`);
                }
            } catch(e) {
                alert("Failed to resolve Modrinth download.");
            }
        }

        // ── Backups ──
        function loadBackups() { wsCmdJson({ type: 'backup_list' }); }
        function renderBackups(backups) {
            const cont = document.getElementById('backup-list');
            cont.innerHTML = backups.length ? '' : '<p>No backups found.</p>';
            backups.forEach(b => {
                cont.innerHTML += `
                    <div class="mod-card" style="flex-direction:row; align-items:center;">
                        <div>
                            <h4 style="margin:0;">${b.name}</h4>
                            <span style="font-size:0.85rem;color:var(--text-muted);">${(b.size/1024/1024).toFixed(2)} MB - ${new Date(b.date*1000).toLocaleString()}</span>
                        </div>
                        <div>
                            <button class="btn btn-w" onclick="if(confirm('Restore this backup? This overrides current data!')) wsCmdJson({type:'backup_restore', name:'${b.name}'})">Restore</button>
                            <button class="btn btn-d" onclick="if(confirm('Delete backup?')) wsCmdJson({type:'backup_delete', name:'${b.name}'})">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        if(instId) {
            fetchServerInfo();
            bootServer();
        }
    </script>
</body>
</html>
