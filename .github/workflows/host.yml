name: AbsoraCloud Multi-Tenant Runner

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Type of runner'
        required: false
        default: 'multi-tenant'
  repository_dispatch:
    types: [start-runner]

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install websockets==12.0 requests
          sudo apt-get update
          sudo apt-get install -y prlimit steamcmd

      - name: Install Cloudflared & Bore
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/

      - name: Start Multi-Tenant Daemon
        env:
          BASE_URL: "https://absoracloud-v2.vercel.app" # Replace with your actual Vercel URL
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: python runner/daemon.py
