name: AbsoraCloud Multi-Tenant Runner

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Type of runner'
        required: false
        default: 'multi-tenant'
  repository_dispatch:
    types: [start-runner]

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install websockets==12.0 requests

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y util-linux

      - name: Install Java (for Minecraft servers)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Cloudflared & Bore
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/

      - name: Start Multi-Tenant Daemon
        env:
          BASE_URL: "https://absoramchost.vercel.app"
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: python -u runner/daemon.py
